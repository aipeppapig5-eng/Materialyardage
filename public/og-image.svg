<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04140e" />
      <stop offset="50%" stop-color="#0a2e22" />
      <stop offset="100%" stop-color="#020d09" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10b981" stroke-width="0.75" stroke-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Decorative Glow -->
  <circle cx="1050" cy="150" r="300" fill="#10b981" fill-opacity="0.15" filter="blur(60px)" />
  <circle cx="150" cy="500" r="250" fill="#059669" fill-opacity="0.12" filter="blur(50px)" />

  <!-- Brand Tag -->
  <g transform="translate(80, 85)">
    <rect width="280" height="36" rx="18" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" />
    <circle cx="20" cy="18" r="5" fill="#34d399" />
    <text x="35" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#6ee7b7" letter-spacing="1.5">PRECISION ESTIMATION SUITE</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
    Material Yardage
  </text>

  <!-- Subtitle -->
  <text x="80" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#94a3b8" letter-spacing="-0.3">
    Engineering-grade calculators for homeowners, crafters &amp; contractors
  </text>

  <!-- Feature Tags -->
  <g transform="translate(80, 310)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="180" height="42" rx="10" fill="#0f3d2f" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" />
    <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Concrete Slabs</text>

    <!-- Tag 2 -->
    <rect x="195" y="0" width="170" height="42" rx="10" fill="#0f3d2f" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" />
    <text x="215" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Mulch &amp; Soil Mix</text>

    <!-- Tag 3 -->
    <rect x="380" y="0" width="180" height="42" rx="10" fill="#0f3d2f" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" />
    <text x="400" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Gravel &amp; Stone</text>

    <!-- Tag 4 -->
    <rect x="575" y="0" width="180" height="42" rx="10" fill="#0f3d2f" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" />
    <text x="595" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">2D Fabric Cutters</text>

    <!-- Tag 5 -->
    <rect x="770" y="0" width="170" height="42" rx="10" fill="#0f3d2f" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" />
    <text x="790" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Retaining Walls</text>
  </g>

  <!-- Isometric Schematic Illustration on Right -->
  <g transform="translate(820, 160)">
    <!-- 3D Cube / Schematic -->
    <polygon points="120,40 220,95 120,150 20,95" fill="#10b981" fill-opacity="0.3" stroke="#34d399" stroke-width="2" />
    <polygon points="20,95 120,150 120,260 20,205" fill="#047857" fill-opacity="0.4" stroke="#34d399" stroke-width="2" />
    <polygon points="220,95 120,150 120,260 220,205" fill="#065f46" fill-opacity="0.5" stroke="#34d399" stroke-width="2" />

    <!-- Isometric Dimensions -->
    <line x1="20" y1="85" x2="120" y2="30" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="4,4" />
    <text x="60" y="50" font-family="monospace" font-size="12" font-weight="700" fill="#6ee7b7">36" (1 yd)</text>

    <!-- Volume Tag -->
    <rect x="55" y="180" width="130" height="34" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
    <text x="70" y="202" font-family="monospace" font-size="13" font-weight="700" fill="#a7f3d0">1.00 CU YD</text>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(80, 520)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#1e3a2f" stroke-width="1" />
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#64748b">
      Interactive 2D Cut Visualizer · Multi-Zone BOM Cart · Printable Job-Site Spec Sheets
    </text>
    <text x="1040" y="32" text-anchor="end" font-family="monospace" font-size="14" font-weight="600" fill="#34d399">
      https://www.materialyardage.com
    </text>
  </g>
</svg>
